name: PR checks

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: saldo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d saldo_test"
          --health-interval=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run tests
        run: ./mvnw -B verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/saldo_test
          SPRING_DATASOURCE_USERNAME: test
          SPRING_DATASOURCE_PASSWORD: test
          SECURITY_JWT_ACCESS_SECRET: ${{ secrets.TEST_JWT_ACCESS }}
          SECURITY_JWT_REFRESH_SECRET: ${{ secrets.TEST_JWT_REFRESH }}
