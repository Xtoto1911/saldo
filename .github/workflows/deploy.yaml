name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Start SSH agent with deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Pin server host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.VPS_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pull and restart stack
        run: |
          ssh -o BatchMode=yes -p 22 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} <<'EOF'
          set -e
          cd /opt/saldo/repo
          git pull --ff-only
          cd deploy
          docker compose -f docker-compose.prod.yaml --env-file .env pull backend frontend
          docker compose -f docker-compose.prod.yaml --env-file .env up -d
          sleep 45
          docker compose -f docker-compose.prod.yaml --env-file .env ps
          docker compose -f docker-compose.prod.yaml --env-file .env exec -T backend curl -fsS http://localhost:8080/actuator/health
          curl -fsS http://localhost/auth -o /dev/null
          echo "DEPLOY OK"
          EOF
