spring.application.name=saldo
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5433/saldo_db
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

security.jwt.access-secret=${JWT_ACCESS_SECRET}
security.jwt.refresh-secret=${JWT_REFRESH_SECRET}
security.jwt.access-ttl=10m 
security.jwt.refresh-ttl=15d 

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql = true
